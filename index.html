<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="爻一爻" />
    <title>爻一爻 - 仅供娱乐</title>
    <script src="/yaoyiyao/yao-sync.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ===== 启动诊断（APK 白屏排查用，正常运行时 5 秒后自动隐藏）=====
      (function () {
        var boot = document.createElement('div');
        boot.id = 'boot-status';
        boot.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:12px 14px;background:#FFE8E8;color:#B00020;font-size:13px;line-height:1.6;z-index:99999;white-space:pre-wrap;word-break:break-all;display:none;font-family:sans-serif;';
        document.body.appendChild(boot);
        function showBoot(msg) { boot.style.display = 'block'; boot.textContent = '[诊断] ' + msg; }
        window.addEventListener('error', function (e) {
          showBoot('window.onerror: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 3).join('\n') : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showBoot('unhandledrejection: ' + (r && r.message ? r.message : String(r)));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            boot.style.display = 'none';
          } else {
            showBoot('5 秒后页面仍为空——JavaScript 未执行。\n可能原因：模块脚本加载被拦（CORS/MIME）、脚本语法错误，或 WebView 未正确加载。');
          }
        }, 5000);
      })();
    </script>
    <script>
      // 清理旧 Service Worker 防止缓存白屏
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
      }
    </script>
    <script>
      // GitHub Pages SPA fallback: restore the original path from 404.html redirect
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          var path = redirect.replace(/^\/yaoyiyao/, '') || '/';
          history.replaceState(null, '', '/yaoyiyao' + path);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
