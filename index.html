  <body>
    <div id="root"></div>
    <script>
      // ===== 启动自愈（静默）：首次 15 秒内未挂载则自动刷新一次（诊断日志已关闭）=====
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          if (!sessionStorage.getItem('yyy_boot_retried')) {
            sessionStorage.setItem('yyy_boot_retried', '1');
            location.reload();
          }
        }, 15000);
      })();
    </script>
    <script>
      // 清理旧 Service Worker 防止缓存白屏
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
      }
    </script>
    <script>
      // GitHub Pages SPA fallback: restore the original path from 404.html redirect
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          var path = redirect.replace(/^\/yaoyiyao/, '') || '/';
          history.replaceState(null, '', '/yaoyiyao' + path);
        }
      })();
    </script>
